<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experimentación Enrútate</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="experimentacion-page">

    <main class="exp-root" id="expRoot">

        <!-- ENTRADA -->
        <section class="exp-entry" id="expEntry">

            <a class="exp-landing-link" href="index.html" aria-label="Volver al Landing">
                ←
            </a>

            <div class="exp-entry-center">

                <div class="exp-entry-board-mark" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <p class="exp-entry-note">
                    Escoge un color para tu personaje
                </p>

                <div class="exp-character-picker" aria-label="Seleccionar personaje">

                    <button class="exp-character exp-character--violet" type="button" data-exp-character="violet" aria-label="Seleccionar personaje violeta"></button>

                    <button class="exp-character exp-character--pink" type="button" data-exp-character="pink" aria-label="Seleccionar personaje rosado"></button>

                    <button class="exp-character exp-character--orange" type="button" data-exp-character="orange" aria-label="Seleccionar personaje naranja"></button>

                    <button class="exp-character exp-character--cyan" type="button" data-exp-character="cyan" aria-label="Seleccionar personaje cian"></button>

                </div>

                <button class="exp-enter-button" type="button" data-exp-enter aria-label="Entrar al tablero" disabled>
                    →
                </button>

            </div>

        </section>

        <!-- TABLERO FULL SCREEN -->
        <section class="exp-board-screen" id="expBoardScreen" aria-label="Tablero interactivo">

            <div class="exp-board-actions">

                <button type="button" data-exp-back-entry aria-label="Volver al inicio">
                    ←
                </button>

                <div class="exp-step-indicator" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <button type="button" data-exp-reset aria-label="Reiniciar experiencia">
                    ↺
                </button>

            </div>

            <div class="exp-progress-ring" aria-hidden="true">
                <svg viewBox="0 0 120 120">
                    <circle class="exp-progress-bg" cx="60" cy="60" r="52"></circle>
                    <circle class="exp-progress-fill" id="expProgressFill" cx="60" cy="60" r="52"></circle>
                </svg>
            </div>

            <div class="exp-board-layout">

                <div class="exp-board-wrap">

                    <svg class="exp-board-svg" id="expBoardSvg" viewBox="0 0 1000 1000" role="img" aria-label="Tablero en capas">
                        <g id="expLayerRings"></g>
                        <g id="expBaseEdges"></g>
                        <g id="expFogLayer"></g>
                        <g id="expTrailLayer"></g>
                        <g id="expCellsLayer"></g>
                        <g id="expPlayerLayer"></g>
                    </svg>

                </div>

                <aside class="exp-effects-panel" aria-label="Efectos descubiertos">

                    <div class="exp-effect-card" data-exp-effect="blue">
                        <i class="effect-dot effect-dot--blue"></i>
                        <span>gira capa</span>
                    </div>

                    <div class="exp-effect-card" data-exp-effect="green">
                        <i class="effect-dot effect-dot--green"></i>
                        <span>revela entorno</span>
                    </div>

                    <div class="exp-effect-card" data-exp-effect="red">
                        <i class="effect-dot effect-dot--red"></i>
                        <span>vuelve al centro</span>
                    </div>

                    <div class="exp-effect-card" data-exp-effect="yellow">
                        <i class="effect-dot effect-dot--yellow"></i>
                        <span>punto inicial</span>
                    </div>

                </aside>

            </div>

        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
